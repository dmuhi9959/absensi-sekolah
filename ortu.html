<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aplikasi Orang Tua - Absensi Siswa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.header{background:#1a8a6f;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:1.1rem;position:sticky;top:0;z-index:100}
.content{flex:1;overflow-y:auto;padding:20px}
.login-box{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-top:20px}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:0.8rem;color:#555;margin-bottom:5px;font-weight:600}
.form-group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:1rem}
.btn{width:100%;padding:14px;background:#1a8a6f;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-logout{background:#f44336;margin-top:20px}
.profile-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center;margin-bottom:20px}
.profile-photo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;border:3px solid #1a8a6f}
.profile-name{font-size:1.2rem;font-weight:bold;color:#333}
.profile-class{font-size:0.9rem;color:#666}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
th{background:#1a8a6f;color:#fff;padding:12px;text-align:left;font-size:0.8rem}
td{padding:10px;border-bottom:1px solid #eee;font-size:0.8rem;color:#333;text-align:left}
</style>
</head>
<body>

<div class="header">Absensi Siswa (Orang Tua)</div>

<div class="content" id="mainContent">
    <div class="login-box">
        <h3 style="text-align:center;margin-bottom:15px;">Login Orang Tua</h3>
        <div class="form-group">
            <label>Masukkan ID Kartu Siswa (UID)</label>
            <input id="loginUid" placeholder="Contoh: D5DF3903">
        </div>
        <button class="btn" onclick="loginOrtu()">Lihat Absensi</button>
        <p style="font-size:0.75rem;color:#888;text-align:center;margin-top:15px;">ID Kartu dapat dilihat di bagian belakang kartu RFID atau bertanya ke admin sekolah.</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB6UX6KIwVCCfArhcrVum2aIQyTHjMXfKU",
  authDomain: "absensi-pelajar.firebaseapp.com",
  databaseURL: "https://absensi-pelajar-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absensi-pelajar",
  storageBucket: "absensi-pelajar.firebasestorage.app",
  messagingSenderId: "194969066694",
  appId: "1:194969066694:web:2f351904c2c1642c7ccbc7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function loginOrtu() {
    let uid = document.getElementById('loginUid').value.toUpperCase().trim();
    if(!uid) { alert("Masukkan ID Kartu!"); return; }
    
    db.ref('master_data/siswa/' + uid).once('value').then((snapshot) => {
        if(snapshot.exists()) {
            let d = snapshot.val();
            showAbsensi(uid, d);
        } else {
            alert("ID Kartu tidak ditemukan! Periksa kembali penulisan ID.");
        }
    });
}

function showAbsensi(uid, siswaData) {
    let html = `
        <div class="profile-card">
            ${siswaData.photo ? `<img src="${siswaData.photo}" class="profile-photo">` : `<i class="fas fa-user-circle" style="font-size:80px;color:#ccc;"></i>`}
            <div class="profile-name">${siswaData.nama}</div>
            <div class="profile-class">Kelas: ${siswaData.kelas}</div>
        </div>
        
        <h3 style="margin-bottom:10px;color:#333;">Riwayat Absensi (7 Hari Terakhir)</h3>
        <table>
            <thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Status</th></tr></thead>
            <tbody id="bodyRiwayat">
                <tr><td colspan="4" style="text-align:center">Memuat...</td></tr>
            </tbody>
        </table>
        
        <button class="btn btn-logout" onclick="location.reload()"><i class="fas fa-sign-out-alt"></i> Keluar</button>
    `;
    document.getElementById('mainContent').innerHTML = html;
    
    // Ambil data 7 hari terakhir
    let today = new Date();
    let dates = [];
    for(let i=0; i<7; i++) {
        let d = new Date(today);
        d.setDate(d.getDate() - i);
        let dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        dates.push(dateStr);
    }
    
    let riwayatHtml = '';
    let count = 0;
    
    // Cek satu per satu tanggalnya
    dates.forEach(dateStr => {
        db.ref('absensi/' + dateStr + '/' + uid).once('value').then((snapshot) => {
            count++;
            let d = snapshot.val();
            let tglFormat = dateStr.split('-').reverse().join('-'); // Ubah ke DD-MM-YYYY
            if(d) {
                riwayatHtml += `<tr><td>${tglFormat}</td><td>${d.masuk || '-'}</td><td>${d.keluar || '-'}</td><td>${d.status || 'Hadir'}</td></tr>`;
            } else {
                riwayatHtml += `<tr><td>${tglFormat}</td><td colspan="3" style="text-align:center;color:#999">Tidak ada catatan</td></tr>`;
            }
            
            if(count === 7) {
                document.getElementById('bodyRiwayat').innerHTML = riwayatHtml;
            }
        });
    });
}
</script>
</body>
</html>
